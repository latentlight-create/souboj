<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Souboj">
<meta name="theme-color" content="#1b1d3a">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Souboj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Hrací deska: hráč 1 (červená) dole, hráč 2 (modrá) nahoře otočený o 180°. Celá deska se podle sezení otočí o 90°,
   takže hráči vždy sedí u protilehlých stran. Všechny rozměry jsou v jednotce --u (setina kratší strany desky). */
:root{--r:#ff4d5e;--rd:#d42a43;--b:#2f80ed;--bd:#1a5bbd;--ink:#1b1d3a;--paper:#fff8e7;--yellow:#ffc93c;--green:#2fbf71;--u:8px;color-scheme:light}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none;touch-action:none;position:fixed;inset:0}
body{font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--ink);font-weight:800}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;touch-action:none;cursor:pointer}
[hidden]{display:none!important}
#board{position:fixed;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--ink)}
.side{flex:1 1 0;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.side.p1{background:var(--r)}
.side.p2{background:var(--b);transform:rotate(180deg)}
.zone{flex:1 1 0;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);padding:calc(var(--u)*2);text-align:center;color:#fff}
.zone.outp{filter:grayscale(.7) brightness(.75)}
.hud{flex:none;height:calc(var(--u)*10);display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2);padding:0 calc(var(--u)*4);color:#fff;background:rgba(0,0,0,.2);position:relative}
.hud .nm{font-size:calc(var(--u)*3.8);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .sc{font-size:calc(var(--u)*7.5);line-height:1;min-width:1.2em;text-align:right;font-variant-numeric:tabular-nums}
.hud .sc.bump{animation:bump .25s}
.hud .tbar{position:absolute;left:0;top:0;height:calc(var(--u)*1.2);background:#fff;width:100%;transform-origin:0 50%}
.mid{flex:0 0 0;min-height:0;position:relative;background:var(--paper);overflow:hidden}
#layer{position:absolute;inset:0;pointer-events:none;z-index:5}
/* fáze */
#board[data-phase=menu] .side,#board[data-phase=menu] .mid,#board[data-phase=menu] #layer,#board[data-phase=menu] #exit{visibility:hidden}
#board:not([data-phase=menu]) #menu{display:none}
#board[data-phase=play].g-tiles .side,#board[data-phase=play].g-moles .side{flex:0 0 auto}
#board[data-phase=play].g-tiles .zone,#board[data-phase=play].g-moles .zone{display:none}
#board[data-phase=play].g-tiles .mid,#board[data-phase=play].g-moles .mid{flex:1 1 0}
/* karty v polovině hráče */
.card{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.8);max-width:94%}
.card h2{margin:0;font-size:calc(var(--u)*7);line-height:1;text-wrap:balance}
.card p{margin:0;font-size:calc(var(--u)*3);line-height:1.25;font-weight:600;max-width:30em;text-wrap:balance}
.row{display:flex;gap:calc(var(--u)*2);flex-wrap:wrap;justify-content:center;align-items:center}
.big{font-size:calc(var(--u)*4.8);padding:calc(var(--u)*2) calc(var(--u)*6);border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 calc(var(--u)*.9) 0 rgba(0,0,0,.25);line-height:1.1}
.big.on{background:var(--green);color:#fff}
.big.ghost{background:rgba(255,255,255,.25);color:#fff}
.big:active{transform:translateY(calc(var(--u)*.5))}
.pill{font-size:calc(var(--u)*2.8);padding:calc(var(--u)*1) calc(var(--u)*3);border-radius:999px;background:rgba(255,255,255,.25);color:#fff}
.pill.on{background:#fff;color:var(--ink)}
.count{font-size:calc(var(--u)*30);line-height:1;animation:pop .45s}
.note{font-size:calc(var(--u)*3.4);min-height:1.3em;font-weight:600}
/* plácací plocha */
.pad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:calc(var(--u)*3)}
.pad *{pointer-events:none}
.padtxt{font-size:calc(var(--u)*8.5);line-height:1.05;color:#fff;text-shadow:0 calc(var(--u)*.5) 0 rgba(0,0,0,.2);text-wrap:balance}
.rip{position:absolute;width:calc(var(--u)*14);height:calc(var(--u)*14);margin:calc(var(--u)*-7) 0 0 calc(var(--u)*-7);border-radius:50%;background:rgba(255,255,255,.55);animation:rip .45s ease-out forwards}
/* přetahovaná */
.g-tug .pad{align-items:flex-end}
.rope{position:absolute;left:50%;top:20%;bottom:20%;width:calc(var(--u)*2.2);margin-left:calc(var(--u)*-1.1);border-radius:999px;background:repeating-linear-gradient(180deg,#c98b4a 0 calc(var(--u)*2),#a86f33 calc(var(--u)*2) calc(var(--u)*4))}
.line{position:absolute;left:8%;right:8%;height:calc(var(--u)*1.2);margin-top:calc(var(--u)*-.6);border-radius:999px;background:#fff;opacity:.9}
.knot{position:absolute;left:50%;top:50%;font-size:calc(var(--u)*16);line-height:1;transform:translate(-50%,-50%);transition:top .12s ease-out;filter:drop-shadow(0 calc(var(--u)*.8) 0 rgba(0,0,0,.25))}
/* kdo dřív */
.sig{position:absolute;left:50%;font-size:calc(var(--u)*22);line-height:1;transform:translate(-50%,-50%)}
.sig.a{top:calc(50% + var(--u)*15)}
.sig.b{top:calc(50% - var(--u)*15);transform:translate(-50%,-50%) rotate(180deg)}
.sig.pop{animation:sigpop .22s}
/* barevná bitva */
.grid{position:absolute;inset:calc(var(--u)*1.5);display:grid;gap:calc(var(--u)*1.2)}
.tile{border-radius:calc(var(--u)*2.4);background:var(--r);box-shadow:inset 0 calc(var(--u)*-.8) 0 rgba(0,0,0,.18)}
.tile.o1{background:var(--b)}
.tile.flip{animation:flip .18s}
/* krtci */
.field{position:absolute;inset:0;background:radial-gradient(circle at 20% 25%,#ffe9b3 0 8%,transparent 9%),radial-gradient(circle at 78% 70%,#ffe9b3 0 10%,transparent 11%),var(--paper)}
.mole{position:absolute;width:calc(var(--u)*17);height:calc(var(--u)*17);margin:calc(var(--u)*-8.5) 0 0 calc(var(--u)*-8.5);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*10);line-height:1;background:var(--r);box-shadow:0 calc(var(--u)*.8) 0 rgba(0,0,0,.22),inset 0 0 0 calc(var(--u)*.9) rgba(255,255,255,.55);animation:molein .18s ease-out}
.mole *{pointer-events:none;display:block}
.mole.o1{background:var(--b)}
.mole.o1 span{transform:rotate(180deg)}
.mole.out{animation:moleout .2s forwards}
.mole.hit{animation:molehit .22s forwards}
/* souboj i/y */
.word{font-size:calc(var(--u)*11);line-height:1.05;letter-spacing:.02em}
.word .gap{display:inline-block;min-width:.6em;border-bottom:calc(var(--u)*.8) solid #fff;margin:0 .04em;line-height:.9}
.word .gap.fill{border-color:transparent;color:var(--yellow)}
.iybtn{font-size:calc(var(--u)*8);width:calc(var(--u)*27);height:calc(var(--u)*15);border-radius:calc(var(--u)*4);background:#fff;color:var(--ink);box-shadow:0 calc(var(--u)*.9) 0 rgba(0,0,0,.25);line-height:1}
.iybtn.ok{background:var(--green);color:#fff}
.iybtn.bad{background:#ffd0d0;color:var(--rd)}
/* počítací hry */
.word.sm{font-size:calc(var(--u)*8.5)}
.word .hl{color:var(--yellow)}
.ans{font-size:calc(var(--u)*7);min-width:calc(var(--u)*22);height:calc(var(--u)*12.5);padding:0 calc(var(--u)*2);border-radius:calc(var(--u)*3.5);background:#fff;color:var(--ink);box-shadow:0 calc(var(--u)*.9) 0 rgba(0,0,0,.25);line-height:1;font-variant-numeric:tabular-nums}
.ans.ok{background:var(--green);color:#fff}
.ans.bad{background:#ffd0d0;color:var(--rd)}
.track{position:relative;width:92%;height:calc(var(--u)*9);border-radius:999px;background:rgba(0,0,0,.22);flex:none}
.track i{position:absolute;font-style:normal;line-height:1;font-size:calc(var(--u)*4.6)}
.track .flag{right:calc(var(--u)*1.2);top:50%;transform:translateY(-50%);font-size:calc(var(--u)*5.5)}
.track .car{left:0;transition:left .3s ease-out;transform:scaleX(-1)}
.track .car.c0{top:calc(var(--u)*-.4)}
.track .car.c1{top:calc(var(--u)*4.2)}
.bals{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*2.2);max-width:100%}
.bal{width:calc(var(--u)*17);height:calc(var(--u)*17);border-radius:50% 50% 50% 50%/46% 46% 54% 54%;font-size:calc(var(--u)*6.5);color:var(--ink);box-shadow:inset calc(var(--u)*-1) calc(var(--u)*-1.4) 0 rgba(0,0,0,.14),0 calc(var(--u)*.8) 0 rgba(0,0,0,.2);animation:bob 2.6s ease-in-out infinite;line-height:1;font-variant-numeric:tabular-nums}
.bal.pop{animation:molehit .22s forwards;pointer-events:none}
.nums{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*1.6);max-width:100%}
.num{width:calc(var(--u)*16.5);height:calc(var(--u)*10.5);border-radius:calc(var(--u)*2.6);background:#fff;color:var(--ink);font-size:calc(var(--u)*5.6);box-shadow:0 calc(var(--u)*.7) 0 rgba(0,0,0,.22);line-height:1;font-variant-numeric:tabular-nums}
.num.ok{background:var(--green);color:#fff}
.num.bad{background:#ffd0d0;color:var(--rd);animation:shakex .3s}
/* kreativita: kreslicí plocha v polovině hráče */
.kz{position:absolute;inset:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1.4) calc(var(--u)*2)}
.kzhead,.kzfoot{flex:none;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.4);flex-wrap:wrap}
.kzt{font-size:calc(var(--u)*4.2);line-height:1.1;color:#fff}
.kzt b{color:var(--yellow)}
.kzpct{font-size:calc(var(--u)*4.2);color:#fff;font-variant-numeric:tabular-nums;min-width:3.4em;text-align:right}
.kzb{font-size:calc(var(--u)*3.3);padding:calc(var(--u)*1.1) calc(var(--u)*3);border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 calc(var(--u)*.6) 0 rgba(0,0,0,.25);line-height:1.15}
.kzb.on{background:var(--green);color:#fff}
.kzb.dim{opacity:.4}
.kzcv{flex:1 1 0;min-height:0;position:relative;background:var(--paper);border-radius:calc(var(--u)*3);overflow:hidden}
.kzcv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.kzwait{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,248,231,.55);font-size:calc(var(--u)*5);color:var(--ink);pointer-events:none}
.sw{width:calc(var(--u)*7.2);height:calc(var(--u)*7.2);border-radius:50%;box-shadow:0 calc(var(--u)*.5) 0 rgba(0,0,0,.25),inset 0 0 0 calc(var(--u)*.5) rgba(255,255,255,.7)}
.sw.on{transform:scale(1.18);box-shadow:0 0 0 calc(var(--u)*.7) #fff}
.gopt{font-size:calc(var(--u)*3.8);padding:calc(var(--u)*1.3) calc(var(--u)*2.6);border-radius:calc(var(--u)*2.4);background:#fff;color:var(--ink);box-shadow:0 calc(var(--u)*.7) 0 rgba(0,0,0,.25);min-width:calc(var(--u)*19);line-height:1.1}
.gopt.ok{background:var(--green);color:#fff}
.gopt.bad{background:#ffd0d0;color:var(--rd)}
/* konfety */
.cf{position:absolute;top:-6%;width:calc(var(--u)*1.6);height:calc(var(--u)*2.4);border-radius:calc(var(--u)*.4);animation:fall linear forwards;pointer-events:none;z-index:4}
/* menu */
#menu{position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 15% 0%,#3a2f7a 0,transparent 45%),radial-gradient(circle at 90% 100%,#7a2f55 0,transparent 45%),var(--ink);color:#fff;overflow:auto;touch-action:pan-y;padding:calc(var(--u)*4) calc(var(--u)*4) calc(var(--u)*6);display:flex;flex-direction:column;gap:calc(var(--u)*2.6);align-items:center}
#menu h1{font-size:calc(var(--u)*12);margin:0;line-height:.95;letter-spacing:.04em}
#menu h1 i{font-style:normal}
#menu h1 .cr{color:var(--r)} #menu h1 .cb{color:var(--b)} #menu h1 .cy{color:var(--yellow)}
.tag{margin:0;font-weight:600;font-size:calc(var(--u)*3);opacity:.85;text-align:center;text-wrap:balance}
.tally{font-size:calc(var(--u)*5);display:flex;gap:calc(var(--u)*2);align-items:center;line-height:1}
.tally .tr{color:var(--r)} .tally .tb{color:#6fb0ff}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--u)*40),1fr));gap:calc(var(--u)*2.4);width:100%;max-width:calc(var(--u)*130)}
.game{display:flex;align-items:center;gap:calc(var(--u)*2.5);padding:calc(var(--u)*2.4) calc(var(--u)*3);border-radius:calc(var(--u)*4);color:var(--ink);text-align:left;box-shadow:0 calc(var(--u)*1) 0 rgba(0,0,0,.4);touch-action:pan-y}
.game:active{transform:translateY(calc(var(--u)*.5))}
.game .em{font-size:calc(var(--u)*9);line-height:1}
.game b{display:block;font-size:calc(var(--u)*4.6);line-height:1.05}
.game small{display:block;font-size:calc(var(--u)*2.6);font-weight:600;line-height:1.2;opacity:.85}
.gamesw{width:100%;max-width:calc(var(--u)*130);display:flex;flex-direction:column;gap:calc(var(--u)*2)}
.sect{margin:calc(var(--u)*1) 0 0;font-size:calc(var(--u)*3.2);letter-spacing:.1em;text-transform:uppercase;opacity:.75;font-weight:800}
.opts{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.6);justify-content:center}
.opt{font-size:calc(var(--u)*2.8);padding:calc(var(--u)*1.4) calc(var(--u)*3);border-radius:999px;background:rgba(255,255,255,.14);color:#fff;touch-action:pan-y}
/* odchod ze hry */
#exit{position:absolute;left:calc(var(--u)*1);top:50%;transform:translateY(-50%);z-index:15;width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:calc(var(--u)*3.4);line-height:1}
#exitgo{position:absolute;left:calc(var(--u)*9.5);top:50%;transform:translateY(-50%);z-index:15;font-size:calc(var(--u)*3.4);padding:calc(var(--u)*1.6) calc(var(--u)*4);border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 calc(var(--u)*.8) 0 rgba(0,0,0,.3)}
@keyframes rip{from{transform:scale(.3);opacity:.9}to{transform:scale(1.7);opacity:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes bump{50%{transform:scale(1.35)}}
@keyframes sigpop{0%{scale:.5}70%{scale:1.2}100%{scale:1}}
@keyframes flip{50%{transform:scale(.8) rotate(8deg)}}
@keyframes molein{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes moleout{to{transform:scale(0);opacity:0}}
@keyframes molehit{50%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-1.6))}}
@keyframes shakex{25%{transform:translateX(calc(var(--u)*-1))}75%{transform:translateX(calc(var(--u)*1))}}
@keyframes fall{to{transform:translateY(calc(var(--u)*80)) rotate(720deg);opacity:.2}}
</style>
</head>
<body>
<div id="board" data-phase="menu">
  <section class="side p2" id="s1"><div class="zone" id="z1"></div><div class="hud" id="h1"></div></section>
  <div class="mid" id="mid"></div>
  <section class="side p1" id="s0"><div class="zone" id="z0"></div><div class="hud" id="h0"></div></section>
  <div id="layer"></div>
  <button id="exit" data-act="exit" aria-label="Ukončit hru">✕</button>
  <button id="exitgo" data-act="menu" hidden>Do menu</button>
  <div id="menu">
    <h1><i class="cr">SOU</i><i class="cy">⚡</i><i class="cb">BOJ</i></h1>
    <p class="tag">Dva hráči, jeden iPad. Položte ho na stůl a sedněte si naproti sobě.</p>
    <div class="tally"><span class="tr"><span id="n0"></span> <span id="w0">0</span></span><span>:</span><span class="tb"><span id="w1">0</span> <span id="n1"></span></span></div>
    <div class="gamesw" id="games"></div>
    <div class="opts" id="opts"></div>
  </div>
</div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), board=$('#board');
const Z=[$('#z0'),$('#z1')], HUD=[$('#h0'),$('#h1')], SIDE=[$('#s0'),$('#s1')], MID=$('#mid'), LAYER=$('#layer');
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- nastavení ---------- */
const KEY='souboj-v1';
let S={seat:'short',hc:-1,muted:false,names:['Červená','Modrá'],wins:[0,0],iy:[0,1],mat:[0,1],kr:[0,1]};
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s==='object') S=Object.assign(S,s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ---------- rozložení: hráči sedí u kratších (nebo delších) stran, deska se podle toho otočí ---------- */
function layout(){
  const vw=innerWidth,vh=innerHeight,land=vw>vh; const rot=S.seat==='short'?land:!land; const BW=rot?vh:vw,BH=rot?vw:vh;
  board.style.width=BW+'px'; board.style.height=BH+'px'; board.style.transform=rot?'translate('+vw+'px,0) rotate(90deg)':'none';
  board.style.setProperty('--u',(Math.min(BW,BH)/100)+'px');
  board._rot=rot; board._vw=vw;
  if(phase==='play'&&cur&&cur.relayout) setTimeout(()=>{ if(phase==='play'&&cur&&cur.relayout) cur.relayout(); },80);
}
addEventListener('resize',layout); addEventListener('orientationchange',()=>setTimeout(layout,200));

/* ---------- zvuk ---------- */
const Snd={ctx:null,
  init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); },
  tone(f,dur,o={}){ if(!this.ctx||S.muted) return; const c=this.ctx,t=c.currentTime+(o.at||0),os=c.createOscillator(),g=c.createGain(); os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t); if(o.slide) os.frequency.exponentialRampToValueAtTime(o.slide,t+dur); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(o.vol||0.12,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); os.connect(g).connect(c.destination); os.start(t); os.stop(t+dur+0.05); },
  tap(p){ this.tone(p===0?520:700,0.05,{type:'triangle',vol:.1}); },
  tick(){ this.tone(900,0.04,{type:'square',vol:.04}); },
  beep(hi){ this.tone(hi?1040:620,hi?0.35:0.15,{type:'square',vol:.09}); },
  go(){ this.tone(880,0.12,{type:'square',vol:.1}); this.tone(1320,0.2,{type:'square',vol:.1,at:.1}); },
  ding(){ this.tone(740,0.1,{type:'triangle',vol:.14}); this.tone(1110,0.25,{type:'triangle',vol:.12,at:.09}); },
  buzz(){ this.tone(170,0.3,{type:'sawtooth',vol:.09,slide:100}); },
  fanfare(){ [[523,0],[659,.12],[784,.24],[1047,.36],[1319,.5]].forEach(([f,d])=>this.tone(f,.3,{type:'triangle',vol:.13,at:d})); },
};

/* ---------- slova pro souboj i/y ---------- */
const W=s=>s.split(' ').map(x=>{ const [w,l]=x.split(':'); return {w,l}; });

const ri=(a,b)=>Math.floor(rnd(a,b+1));
function mkProblem(lvl){ const op=pick(lvl===0?['+','+','−','−','·']:['+','−','·','·',':',':']); let a,b;
  if(op==='+'){ if(lvl===0){ a=ri(2,15); b=ri(2,Math.max(3,25-a)); } else { a=ri(12,79); b=ri(11,Math.min(89,150-a)); } return {q:a+' + '+b,a:a+b}; }
  if(op==='−'){ if(lvl===0){ a=ri(6,20); b=ri(1,a-1); } else { a=ri(31,99); b=ri(11,a-5); } return {q:a+' − '+b,a:a-b}; }
  if(op==='·'){ if(lvl===0){ a=pick([2,3,4,5,10]); b=ri(1,10); } else { a=ri(3,9); b=ri(3,9); } if(Math.random()<.5){ const t=a; a=b; b=t; } return {q:a+' · '+b,a:a*b,f:Math.min(a,b)>1?Math.min(a,b):Math.max(a,b)}; }
  b=ri(3,9); const c=ri(2,9); return {q:(b*c)+' : '+b,a:c}; }

function options(pr,n){ const s=[pr.a]; const c=shuffle([1,-1,2,-2,3,-3,10,-10].concat(pr.f?[pr.f,-pr.f,2*pr.f,-2*pr.f]:[])); for(const d of c){ const v=pr.a+d; if(v>=0&&!s.includes(v)) s.push(v); if(s.length>=n) break; } return shuffle(s); }
function ansRow(pr,n){ return '<div class="row">'+options(pr,n).map(v=>'<button class="ans" data-ans="'+v+'">'+v+'</button>').join('')+'</div>'; }

function zoneOf(el){ return Z[0].contains(el)?0:Z[1].contains(el)?1:-1; }
function coalesced(e){ try{ const l=e.getCoalescedEvents&&e.getCoalescedEvents(); if(l&&l.length) return l; }catch(_){} return [e]; }
function distSeg(q,a,b){ const vx=b[0]-a[0],vy=b[1]-a[1],L=vx*vx+vy*vy; let t=L?((q[0]-a[0])*vx+(q[1]-a[1])*vy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(a[0]+t*vx-q[0],a[1]+t*vy-q[1]); }
function plen(s){ let L=0; for(let i=1;i<s.length;i++) L+=Math.hypot(s[i][0]-s[i-1][0],s[i][1]-s[i-1][1]); return L; }
function sample(s,step){ const o=[s[0]]; for(let i=1;i<s.length;i++){ const a=s[i-1],b=s[i],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/step)); for(let j=1;j<=n;j++) o.push([a[0]+(b[0]-a[0])*j/n,a[1]+(b[1]-a[1])*j/n]); } return o; }
// víc teček: dlouhé hrany rozdělí na kratší úseky
function subdiv(m,T){ const o=[]; for(let i=0;i<m.length;i++){ const a=m[i],b=m[(i+1)%m.length]; o.push(a); const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/T); for(let j=1;j<n;j++) o.push([fx(a[0]+(b[0]-a[0])*j/n),fx(a[1]+(b[1]-a[1])*j/n)]); } return o; }
function inPoly(x,y,P){ let c=false; for(let i=0,j=P.length-1;i<P.length;j=i++){ const a=P[i],b=P[j]; if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])) c=!c; } return c; }
function pickArt(used){ let pool=ART.filter(a=>!used.includes(a)); if(!pool.length){ used.length=0; pool=ART.slice(); } const a=pick(pool); used.push(a); return a; }

function kzSetup(p,o){ const z=Z[p]; z.classList.remove('outp');
  z.innerHTML='<div class="kz"><div class="kzhead">'+(o.head||'')+'</div><div class="kzcv"><canvas></canvas><canvas></canvas></div>'+(o.foot?'<div class="kzfoot">'+o.foot+'</div>':'')+'</div>';
  return kzMeasure(p); }
function kzMeasure(p){ const box=Z[p].querySelector('.kzcv'); const W=box.clientWidth,H=box.clientHeight,dpr=Math.min(2,devicePixelRatio||1);
  const cx=[...box.querySelectorAll('canvas')].map(c=>{ c.width=Math.max(1,Math.round(W*dpr)); c.height=Math.max(1,Math.round(H*dpr)); const x=c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.lineCap='round'; x.lineJoin='round'; return x; });
  const Sq=Math.min(W,H)*0.9, k=Sq/100; return {p,box,W,H,k,ox:(W-Sq)/2,oy:(H-Sq)/2,ink:cx[0],top:cx[1]}; }
// dotek → souřadnice obrázku 100 × 100; počítá s otočením desky (90°) i modré půlky (180°)
function ptLocal(c,e){ let bx=e.clientX,by=e.clientY; if(board._rot){ const t=bx; bx=by; by=board._vw-t; }
  const sd=SIDE[c.p]; bx-=sd.offsetLeft; by-=sd.offsetTop; if(c.p===1){ bx=sd.offsetWidth-bx; by=sd.offsetHeight-by; }
  let el=c.box,ox=0,oy=0; while(el&&el!==sd){ ox+=el.offsetLeft; oy+=el.offsetTop; el=el.offsetParent; }
  return [(bx-ox-c.ox)/c.k,(by-oy-c.oy)/c.k]; }
function cesta(c,x,pts,closed){ x.beginPath(); pts.forEach((q,i)=>{ const X=c.ox+q[0]*c.k,Y=c.oy+q[1]*c.k; i?x.lineTo(X,Y):x.moveTo(X,Y); }); if(closed) x.closePath(); }
function cara(c,x,pts,closed){ if(!pts.length) return; cesta(c,x,pts,closed); if(pts.length===1) x.lineTo(c.ox+pts[0][0]*c.k+.01,c.oy+pts[0][1]*c.k); x.stroke(); }
function kresliArt(c,pic,fill){ [c.ink,c.top].forEach(x=>x.clearRect(0,0,c.W,c.H)); const x=c.top,m=P2(pic.m);
  if(fill){ x.fillStyle=fill; cesta(c,x,m,true); x.fill(); }
  x.strokeStyle='#1b1d3a'; x.lineWidth=Math.max(3,1.3*c.k); cara(c,x,m,true); x.lineWidth=Math.max(2,.9*c.k); pic.x.forEach(s=>cara(c,x,P2(s),false)); }
const hitR=c=>Math.max(5.5,20/c.k);

function vyhodnotKolo(g,w,doKolika){ if(g.done&&w>=0) return; g.done=true; clearTimeout(g.rt); if(w>=0){ setScore(w,score[w]+1); Snd.ding(); }
  [0,1].forEach(q=>{ Z[q].classList.remove('outp'); kresliArt(g.c[q],g.pic,w>=0?SVETLA[w]:'#ffe08a'); kzHead(q,'<span class="kzt">Je to <b>'+esc(g.pic.n)+'</b>! '+(w<0?'':q===w?'Bod pro tebe!':'Soupeř byl rychlejší.')+'</span>'); });
  if(score[0]>=doKolika||score[1]>=doKolika) later(()=>finish(score[0]>score[1]?0:1),1800); else later(()=>g.round(),2600); }

    relayout(){ this.c=[0,1].map(p=>kzMeasure(p)); if(this.done) [0,1].forEach(q=>kresliArt(this.c[q],this.pic,'#ffe08a')); else [0,1].forEach(p=>this.draw(p)); } },
  trace:{name:'Obtáhni',emoji:'✍️',color:'#bde0fe',desc:'Obtáhni prstem čáry obrázku. Kdo první obtáhne celý, má bod.',
    rules:'Obtáhni prstem všechny čárkované čáry obrázku. Když s prstem utečeš daleko od čáry, musíš ho zvednout a začít znovu. Kdo první obtáhne celý obrázek, má bod. Hraje se do 3.',
    start(){ if(S.hc>=0) setScore(S.hc,1); this.used=[]; this.round(); },
    round(){ this.pic=pickArt(this.used); this.done=false; this.ptr=new Map(); const tok=this.tok={};
      const m=P2(this.pic.m); this.tahy=[m.concat([m[0]])].concat(this.pic.x.map(P2));
      this.cp=[]; this.tahy.forEach((s,si)=>sample(s,3).forEach(q=>this.cp.push([q[0],q[1],si])));
      this.s=[0,1].map(()=>({cov:new Uint8Array(this.cp.length),n:0}));
      this.c=[0,1].map(p=>kzSetup(p,{head:'<span class="kzt">Obtáhni <b>'+esc(this.pic.n)+'</b></span><span class="kzpct" id="pct'+p+'">0 %</span>'}));
      [0,1].forEach(p=>{ this.vodit(p); this.draw(p); });
      this.rt=later(()=>{ if(!this.done&&this.tok===tok) vyhodnotKolo(this,-1,3); },120000); },
    vodit(p){ const c=this.c[p],x=c.ink; x.clearRect(0,0,c.W,c.H); x.strokeStyle='rgba(27,29,58,.4)'; x.lineWidth=Math.max(3,1.5*c.k); x.setLineDash([1.6*c.k,2.2*c.k]); this.tahy.forEach(s=>cara(c,x,s,false)); x.setLineDash([]); },
    draw(p){ const c=this.c[p],x=c.top,s=this.s[p],cp=this.cp; x.clearRect(0,0,c.W,c.H); x.strokeStyle=BARVA[p]; x.lineWidth=Math.max(4,1.6*c.k); x.beginPath();
      for(let i=1;i<cp.length;i++) if(s.cov[i]&&s.cov[i-1]&&cp[i][2]===cp[i-1][2]){ x.moveTo(c.ox+cp[i-1][0]*c.k,c.oy+cp[i-1][1]*c.k); x.lineTo(c.ox+cp[i][0]*c.k,c.oy+cp[i][1]*c.k); }
      x.stroke(); const el=$('#pct'+p); if(el) el.textContent=Math.floor(100*s.n/cp.length)+' %'; },
    blizko(q){ let m=1e9; for(const a of this.cp){ const d=Math.hypot(a[0]-q[0],a[1]-q[1]); if(d<m) m=d; } return m; },
    kryj(p,a,b){ const s=this.s[p]; let z=0; this.cp.forEach((q,i)=>{ if(!s.cov[i]&&distSeg(q,a,b)<=4.5){ s.cov[i]=1; s.n++; z++; } });
      if(z){ this.draw(p); if(s.n>=this.cp.length*0.97) vyhodnotKolo(this,p,3); } },
    tap(e){ if(this.done||!e.target.closest('.kzcv')) return; const p=zoneOf(e.target); if(p<0) return; const q=ptLocal(this.c[p],e),ok=this.blizko(q)<=12;
      this.ptr.set(e.pointerId,{p,last:q,ok}); if(ok) this.kryj(p,q,q); },
    move(e){ const t=this.ptr.get(e.pointerId); if(!t||!t.ok||this.done) return; const c=this.c[t.p];
      for(const ev of coalesced(e)){ const q=ptLocal(c,ev); if(this.blizko(q)>9){ t.ok=false; this.mimo(t.p); return; } this.kryj(t.p,t.last,q); if(this.done) return; t.last=q; } },
    mimo(p){ Snd.buzz(); Z[p].classList.add('outp'); const el=$('#pct'+p); if(el) el.textContent='mimo!'; const tok=this.tok; later(()=>{ if(this.tok!==tok||this.done) return; Z[p].classList.remove('outp'); this.draw(p); },450); },
    up(e){ this.ptr.delete(e.pointerId); },
    relayout(){ this.c=[0,1].map(p=>kzMeasure(p)); if(this.done) [0,1].forEach(q=>kresliArt(this.c[q],this.pic,'#ffe08a')); else [0,1].forEach(p=>{ this.vodit(p); this.draw(p); }); } },
  fill:{name:'Vybarvi',emoji:'🖌️',color:'#ffc6ff',desc:'Vybarvi prstem celý obrázek. Kdo bude první hotový, má bod.',
    rules:'Vybarvi prstem celý obrázek uvnitř čáry. Procenta nahoře ukazují, kolik už máš. Kdo první vybarví celý obrázek, má bod. Hraje se do 3.',
    R:5.5,
    start(){ if(S.hc>=0) setScore(S.hc,1); this.used=[]; this.round(); },
    round(){ this.pic=pickArt(this.used); this.done=false; this.ptr=new Map(); const tok=this.tok={}; const m=this.m=P2(this.pic.m);
      let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; m.forEach(q=>{ x0=Math.min(x0,q[0]); y0=Math.min(y0,q[1]); x1=Math.max(x1,q[0]); y1=Math.max(y1,q[1]); });
      this.bunky=[]; for(let y=y0+1.6;y<y1;y+=3.2) for(let x=x0+1.6;x<x1;x+=3.2) if(inPoly(x,y,m)) this.bunky.push([x,y]);
      this.s=[0,1].map(()=>({cov:new Uint8Array(this.bunky.length),n:0,tahy:[]}));
      this.c=[0,1].map(p=>kzSetup(p,{head:'<span class="kzt">Vybarvi <b>'+esc(this.pic.n)+'</b></span><span class="kzpct" id="pct'+p+'">0 %</span>'}));
      [0,1].forEach(p=>this.cary(p));
      this.rt=later(()=>{ if(!this.done&&this.tok===tok) vyhodnotKolo(this,-1,3); },120000); },
    cary(p){ const c=this.c[p],x=c.top; x.clearRect(0,0,c.W,c.H); x.strokeStyle='#1b1d3a'; x.lineWidth=Math.max(3,1.2*c.k); cara(c,x,this.m,true); x.lineWidth=Math.max(2,.8*c.k); this.pic.x.forEach(s=>cara(c,x,P2(s),false)); },
    stopa(p,a,b){ const c=this.c[p],x=c.ink; x.save(); cesta(c,x,this.m,true); x.clip(); x.strokeStyle=SVETLA[p]; x.lineWidth=this.R*2*c.k; cara(c,x,[a,b],false); x.restore(); },
    barvi(p,a,b){ const s=this.s[p]; this.stopa(p,a,b); s.tahy.push([a,b]); let z=0;
      this.bunky.forEach((q,i)=>{ if(!s.cov[i]&&distSeg(q,a,b)<=this.R){ s.cov[i]=1; s.n++; z++; } });
      if(z){ const el=$('#pct'+p); if(el) el.textContent=Math.floor(100*s.n/this.bunky.length)+' %'; if(s.n>=this.bunky.length*0.93) vyhodnotKolo(this,p,3); } },
    tap(e){ if(this.done||!e.target.closest('.kzcv')) return; const p=zoneOf(e.target); if(p<0) return; const q=ptLocal(this.c[p],e); this.ptr.set(e.pointerId,{p,last:q}); this.barvi(p,q,[q[0]+.01,q[1]]); },
    move(e){ const t=this.ptr.get(e.pointerId); if(!t||this.done) return; const c=this.c[t.p];
      for(const ev of coalesced(e)){ const q=ptLocal(c,ev); if(Math.hypot(q[0]-t.last[0],q[1]-t.last[1])<.6) continue; this.barvi(t.p,t.last,q); t.last=q; if(this.done) return; } },
    up(e){ this.ptr.delete(e.pointerId); },
    relayout(){ this.c=[0,1].map(p=>kzMeasure(p)); if(this.done){ [0,1].forEach(q=>kresliArt(this.c[q],this.pic,'#ffe08a')); return; } [0,1].forEach(p=>{ this.cary(p); this.s[p].tahy.forEach(t=>this.stopa(p,t[0],t[1])); }); } },
  guess:{name:'Hádej obrázek',emoji:'🤔',color:'#fdffb6',desc:'Obrázek se pomalu kreslí. Kdo první pozná, co to je, má bod.',
    rules:'Na obou stranách se pomalu kreslí stejný obrázek. Jakmile poznáš, co to je, ťukni na správné slovo. Chyba tě v tom kole vyřadí. Hraje se do 5.',
    start(){ if(S.hc>=0) setScore(S.hc,1); this.used=[]; this.round(); },
    round(){ this.pic=pickArt(this.used); this.done=false; this.out=[false,false]; const tok=this.tok={};
      const opts=shuffle([this.pic.n].concat(shuffle(ART.filter(a=>a!==this.pic).map(a=>a.n)).slice(0,3)));
      this.c=[0,1].map(p=>kzSetup(p,{head:'<span class="kzt">Co to bude?</span>',foot:opts.map(o=>'<button class="gopt" data-gs="'+esc(o)+'">'+esc(o)+'</button>').join('')}));
      const m=P2(this.pic.m),st=Math.floor(rnd(0,m.length)); this.path=[m.slice(st).concat(m.slice(0,st+1))].concat(this.pic.x.map(P2)); this.len=this.path.reduce((a,s)=>a+plen(s),0);
      this.t0=performance.now(); const D=9000;
      const frame=()=>{ if(cur!==this||this.tok!==tok||phase!=='play'||this.done) return; const f=Math.min(1,(performance.now()-this.t0)/D); [0,1].forEach(p=>this.part(p,f));
        if(f<1) requestAnimationFrame(frame); else this.rt=later(()=>{ if(!this.done&&this.tok===tok) this.konec(-1); },4000); };
      requestAnimationFrame(frame); },
    part(p,f){ const c=this.c[p],x=c.top; x.clearRect(0,0,c.W,c.H); x.strokeStyle='#1b1d3a'; x.lineWidth=Math.max(3,1.3*c.k); let left=f*this.len;
      for(const s of this.path){ if(left<=0) break; x.beginPath(); x.moveTo(c.ox+s[0][0]*c.k,c.oy+s[0][1]*c.k);
        for(let i=1;i<s.length&&left>0;i++){ const a=s[i-1],b=s[i],L=Math.hypot(b[0]-a[0],b[1]-a[1]),t=L?Math.min(1,left/L):1; x.lineTo(c.ox+(a[0]+(b[0]-a[0])*t)*c.k,c.oy+(a[1]+(b[1]-a[1])*t)*c.k); left-=L; }
        x.stroke(); } },
    tap(e){ const b=e.target.closest('[data-gs]'); if(!b||this.done) return; const p=zoneOf(b); if(p<0||this.out[p]) return;
      if(b.dataset.gs===this.pic.n){ b.classList.add('ok'); this.konec(p); }
      else { this.out[p]=true; b.classList.add('bad'); Z[p].classList.add('outp'); Snd.buzz(); kzHead(p,'<span class="kzt">Chyba! Toto kolo čekáš.</span>'); if(this.out[1-p]) this.konec(-1); } },
    konec(w){ if(this.done) return; this.done=true; clearTimeout(this.rt); if(w>=0){ setScore(w,score[w]+1); Snd.ding(); }
      [0,1].forEach(q=>{ Z[q].classList.remove('outp'); kresliArt(this.c[q],this.pic,'#ffe08a'); Z[q].querySelectorAll('[data-gs]').forEach(b=>{ if(b.dataset.gs===this.pic.n) b.classList.add('ok'); });
        kzHead(q,'<span class="kzt">Je to <b>'+esc(this.pic.n)+'</b>! '+(w<0?'':q===w?'Bod pro tebe!':'Soupeř byl rychlejší.')+'</span>'); });
      if(score[0]>=5||score[1]>=5) later(()=>finish(score[0]>score[1]?0:1),1800); else later(()=>this.round(),2400); },
    relayout(){ this.c=[0,1].map(p=>kzMeasure(p)); if(this.done) [0,1].forEach(q=>kresliArt(this.c[q],this.pic,'#ffe08a')); } },
};
const SEKCE=[{t:'Postřeh a rychlost',ids:['tug','react','tiles','moles','iy']},{t:'Počítání',ids:['mat','race','bal','mult']},{t:'Kreativita',ids:['kres','dots','trace','fill','guess']}];

/* ---------- průběh: menu → připraveni → odpočet → hra → výsledek ---------- */
function renderMenu(){
  [0,1].forEach(p=>{ $('#n'+p).textContent=S.names[p]; $('#w'+p).textContent=S.wins[p]; });
  $('#games').innerHTML=SEKCE.map(sk=>'<h3 class="sect">'+sk.t+'</h3><div class="games">'+sk.ids.map(id=>{ const g=GAMES[id]; return '<button class="game" data-act="game" data-g="'+id+'" style="background:'+g.color+'"><span class="em">'+g.emoji+'</span><span><b>'+g.name+'</b><small>'+g.desc+'</small></span></button>'; }).join('')+'</div>').join('');
  $('#opts').innerHTML=[
    ['seat','Sedíme u '+(S.seat==='short'?'kratších':'delších')+' stran iPadu'],
    ['hc','Náskok: '+(S.hc<0?'nikdo':S.names[S.hc])],
    ['mute','Zvuk: '+(S.muted?'vypnutý':'zapnutý')],
    ['names','Jména hráčů'],['reset','Vynulovat výhry']].map(o=>'<button class="opt" data-act="'+o[0]+'">'+esc(o[1])+'</button>').join('');
}
function showMenu(){ clearAll(); cur=null; LAYER.innerHTML=''; MID.innerHTML=''; Z.forEach(z=>{ z.innerHTML=''; z.classList.remove('outp'); }); board.className=''; $('#exitgo').hidden=true; setPhase('menu'); renderMenu(); }
function openGame(id){
  clearAll(); cur=GAMES[id]; cur.id=id; board.className='g-'+id; LAYER.innerHTML=''; MID.innerHTML=''; score=[0,0]; ready=[false,false]; $('#exitgo').hidden=true; setPhase('ready'); renderHud();
  [0,1].forEach(p=>{ Z[p].classList.remove('outp'); Z[p].innerHTML='<div class="card"><h2>'+cur.emoji+' '+cur.name+'</h2><p>'+cur.rules+'</p>'+(cur.extra?cur.extra(p):'')+(S.hc===p?'<p>Máš náskok.</p>':'')+'<button class="big" data-act="ready" data-p="'+p+'">Jsem připraven ✋</button></div>'; });
}
function countdown(){
  setPhase('count'); let n=3;
  const show=t=>{ [0,1].forEach(p=>{ Z[p].innerHTML='<div class="count">'+t+'</div>'; }); };
  const step=()=>{ if(n>0){ show(n); Snd.beep(false); n--; later(step,750); } else { show('TEĎ!'); Snd.beep(true); later(()=>{ setPhase('play'); [0,1].forEach(p=>{ Z[p].innerHTML=''; }); renderHud(); cur.start(); },450); } };
  step();
}
function finish(w){
  if(phase!=='play') return; clearAll(); setPhase('result'); LAYER.innerHTML=''; MID.innerHTML='';
  if(w>=0){ S.wins[w]++; save(); Snd.fanfare(); confetti(w); } else Snd.ding();
  const line=esc(S.names[0])+' '+score[0]+' : '+score[1]+' '+esc(S.names[1]);
  [0,1].forEach(p=>{ Z[p].classList.remove('outp'); Z[p].innerHTML='<div class="card res"><h2>'+(w<0?'Remíza!':p===w?'🏆 VÝHRA!':'Příště to vyjde!')+'</h2><p>'+line+'</p><div class="row" id="rb'+p+'"></div></div>'; });
  later(()=>{ [0,1].forEach(p=>{ const r=$('#rb'+p); if(r) r.innerHTML='<button class="big" data-act="again">Znovu</button><button class="big ghost" data-act="menu">Jiná hra</button>'; }); },1100);
}
function act(a,el){
  if(a==='game'){ openGame(el.dataset.g); }
  else if(a==='ready'){ const p=+el.dataset.p; if(ready[p]) return; ready[p]=true; el.classList.add('on'); el.textContent='Čekám na soupeře…'; Snd.tap(p); if(ready[0]&&ready[1]) later(countdown,350); }
  else if(a==='again'){ if(cur) openGame(cur.id); }
  else if(a==='menu'){ showMenu(); }
  else if(a==='exit'){ const g=$('#exitgo'); g.hidden=!g.hidden; clearTimeout(exitT); if(!g.hidden) exitT=setTimeout(()=>{ g.hidden=true; },2500); }
  else if(a==='iy'){ S.iy[+el.dataset.p]=+el.dataset.v; save(); el.parentNode.querySelectorAll('.pill').forEach(b=>b.classList.toggle('on',b===el)); Snd.tick(); }
  else if(a==='lvl'){ S[el.dataset.k][+el.dataset.p]=+el.dataset.v; save(); el.parentNode.querySelectorAll('.pill').forEach(b=>b.classList.toggle('on',b===el)); Snd.tick(); }
  else if(a==='seat'){ S.seat=S.seat==='short'?'long':'short'; save(); layout(); renderMenu(); }
  else if(a==='hc'){ S.hc=S.hc<1?S.hc+1:-1; save(); renderMenu(); }
  else if(a==='mute'){ S.muted=!S.muted; save(); renderMenu(); if(!S.muted) Snd.tick(); }
  else if(a==='names'){ [0,1].forEach(p=>{ let n=null; try{ n=prompt('Jméno hráče ('+(p===0?'červená':'modrá')+' strana):',S.names[p]); }catch(e){} if(n&&n.trim()) S.names[p]=n.trim().slice(0,12); }); save(); renderMenu(); }
  else if(a==='reset'){ S.wins=[0,0]; save(); renderMenu(); }
}

/* ---------- ovládání: v menu klik, ve hře okamžitě při doteku (víc prstů najednou) ---------- */
$('#menu').addEventListener('click',e=>{ const a=e.target.closest('[data-act]'); if(a){ Snd.init(); Snd.tick(); act(a.dataset.act,a); } });
board.addEventListener('pointerdown',e=>{
  Snd.init(); wake(); if(phase==='menu') return;
  const a=e.target.closest('[data-act]'); if(a){ e.preventDefault(); act(a.dataset.act,a); return; }
  if(phase==='play'&&cur){ e.preventDefault(); cur.tap(e); }
},{passive:false});
board.addEventListener('pointermove',e=>{ if(phase==='play'&&cur&&cur.move){ e.preventDefault(); cur.move(e); } },{passive:false});
['pointerup','pointercancel'].forEach(t=>board.addEventListener(t,e=>{ if(phase==='play'&&cur&&cur.up) cur.up(e); }));
document.addEventListener('touchmove',e=>{ if(phase!=='menu') e.preventDefault(); },{passive:false});
['gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
let lock=null;
function wake(){ if(lock||!('wakeLock' in navigator)) return; navigator.wakeLock.request('screen').then(l=>{ lock=l; l.addEventListener('release',()=>{ lock=null; }); }).catch(()=>{}); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) wake(); });

if(/[?&]test\b/.test(location.search)) window.__souboj={cur:()=>cur,S};
layout(); showMenu();
})();
</script>
